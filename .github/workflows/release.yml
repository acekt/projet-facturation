name: Build and Release Facturier

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Run Test Suites (Desktop & Hub)
        run: npm test

      - name: Verify Architecture Decisions Records
        run: npm run quality:decisions

  release:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_BUILD: '1'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci
        working-directory: .

      - name: Build Electron Standalone Package
        run: npm run build:electron

      - name: Package and Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always