# =============================================================================
# electron-builder.yml — Configuration de Packaging "Facturier"
# =============================================================================
#
# ARCHITECTURE STANDALONE APLATIE (Audit Phase 4) :
#   Le contenu de .next/standalone/ est copié à la RACINE du dossier app.
#   Ainsi, server.js se retrouve côte à côte avec main.js, ce qui correspond
#   exactement à ce que Next.js attend pour résoudre public/ et .next/static/.
#
# FLUX DE BUILD COMPLET :
#   npm run dist
#   └── electron-builder install-app-deps  ← Recompile better-sqlite3 pour Electron
#   └── next build                         ← Génère .next/standalone/
#   └── npm run sync-sqlite                ← Copie le .node recompilé dans standalone
#   └── electron-builder                   ← Package l'app
#
# STRUCTURE DU PAQUET FINAL (app/) :
#   ├── main.js                  # Processus principal Electron
#   ├── preload.js               # Script de préchargement sécurisé
#   ├── server.js                # Serveur Next.js (aplati depuis standalone/)
#   ├── node_modules/            # Dépendances Node.js de standalone (tree-shaked)
#   ├── public/                  # Assets statiques globaux
#   └── .next/static/            # CSS, JS chunks, polices (client-side)
#
# =============================================================================

# ── Identité de l'application ─────────────────────────────────────────────────

appId: com.facturier.invoicing
productName: "Facturier"
copyright: "© 2026 Facturier — Tous droits réservés"

# ── ASAR désactivé ────────────────────────────────────────────────────────────
#
# Raison : better-sqlite3 (.node) et le serveur Next.js doivent pouvoir être
# exécutés directement par le filesystem. L'ASAR empêche l'exécution native.
# Sans ASAR, electron-builder génère un dossier app/ non archivé.
#
asar: false

# ── Inclusion des fichiers dans le paquet ────────────────────────────────────
#
# STRATÉGIE D'APLATISSEMENT STANDALONE :
#   Le dossier .next/standalone/ est copié à la RACINE (to: ".").
#   Résultat : server.js est au même niveau que main.js.
#   Next.js Standalone cherche public/ et .next/static/ relatifs à son CWD,
#   qui correspond maintenant à la racine de l'app — les deux y sont bien présents.
#
files:
  # Fichiers du processus principal Electron
  - main.js
  - preload.js
  - package.json

  # Aplatissement du standalone : server.js + node_modules de Next.js → racine
  # Les .node natifs sont EXCLUS ici car electron-builder les rebuild séparément
  - from: .next/standalone
    to: "."
    filter:
      - "**/*"
      - "!**/*.node"  # Binaires natifs : injectés par install-app-deps + sync-sqlite

  # Assets statiques Next.js (CSS, JS chunks, polices)
  - from: .next/static
    to: .next/static
    filter:
      - "**/*"

  # Assets statiques globaux (icônes, splash, images)
  - from: public
    to: public
    filter:
      - "**/*"

  # ── EXCLUSIONS EXPLICITES ─────────────────────────────────────────────────
  - "!node_modules/**/*"        # node_modules racine : lourd et inutile
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!tsconfig*.json"
  - "!next.config.mjs"
  - "!postcss.config.mjs"
  - "!vitest.config.ts"
  - "!components.json"
  - "!.gitignore"
  - "!audit_report.md"
  - "!SPECIFICATIONS.md"
  - "!__tests__/**/*"
  - "!tests/**/*"
  - "!seed*.ts"
  - "!reset-db.ts"
  - "!database.sqlite"          # BDD créée dans userData au premier lancement
  - "!.git/**/*"
  - "!.next/cache/**/*"

# ── Rebuild des modules natifs (better-sqlite3) ───────────────────────────────
#
# electron-builder recompile les .node pour la version d'Electron cible.
# sync-sqlite copie ensuite le .node recompilé dans standalone/node_modules/
# pour garantir la cohérence ABI entre le process principal et le child process.
#
npmRebuild: true

# ── WINDOWS ───────────────────────────────────────────────────────────────────
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64    # 64-bit uniquement (requis par better-sqlite3)

nsis:
  # Affiche l'assistant d'installation standard (recommandé pour les apps pro)
  oneClick: false
  # Installation par utilisateur courant — évite l'UAC administrateur
  perMachine: false
  # Permet à l'utilisateur de choisir le répertoire d'installation
  allowToChangeInstallationDirectory: true
  # CRITIQUE : ne PAS supprimer userData à la désinstallation
  # (contient la base de données SQLite avec toutes les données financières)
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Facturier"
  # Nom du fichier généré : dist/Facturier-Setup-1.0.0.exe
  artifactName: "${productName}-Setup-${version}.${ext}"

# ── MACOS ─────────────────────────────────────────────────────────────────────
mac:
  icon: build/icon.icns
  category: public.app-category.finance
  target:
    - target: dmg
      arch:
        - x64      # Intel
        - arm64    # Apple Silicon (M1/M2/M3)

dmg:
  title: "${productName} ${version}"
  artifactName: "${productName}-${version}.${ext}"

# ── LINUX ─────────────────────────────────────────────────────────────────────
linux:
  icon: build/icon.png
  category: Finance
  target:
    - target: AppImage
      arch:
        - x64

# ── Publication désactivée (app offline, pas de mise à jour automatique) ──────
# Pour activer les mises à jour auto, configurer electron-updater ici.
# publish: null
