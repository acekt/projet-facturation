# ==============================================================================
# Facturier — PowerSync Sync Rules (Règles de synchronisation des Buckets)
# ==============================================================================
# Ce fichier définit les flux de données synchronisés entre PostgreSQL (Supabase)
# et les terminaux de caisse Desktop (SQLite embarqué).
#
# Principe de Sécurité Strict :
#  1. Isolation Multi-Tenant : Aucun terminal ne peut recevoir les données
#     d'une autre entreprise. Le tenant_id est extrait du JWT ou du profil.
#  2. Broadcast Global/Ciblé : Les annonces administratives urgentes émises
#     depuis le Hub sont synchronisées si elles ciblent le tenant ou globalement.
# ==============================================================================

bucket_definitions:
  # ----------------------------------------------------------------------------
  # 1. Bucket Données Métier de l'Entreprise (Tenant Data)
  #    Cloisonnement absolu : un bucket par tenant_id.
  # ----------------------------------------------------------------------------
  tenant_data:
    parameters: >-
      SELECT COALESCE(
        request.jwt() ->> 'tenant_id',
        (SELECT tenant_id::text FROM public.profiles WHERE id = request.user_id())
      ) as tenant_id
    data:
      - SELECT * FROM public.tenants WHERE id::text = bucket.tenant_id
      - SELECT * FROM public.profiles WHERE tenant_id::text = bucket.tenant_id
      - SELECT * FROM public.clients WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.services WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.quotes WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.quote_items WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.invoices WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.invoice_items WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.payments WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.credit_notes WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.credit_note_items WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.audit_logs WHERE tenant_id = bucket.tenant_id
      - SELECT * FROM public.tenant_settings WHERE tenant_id = bucket.tenant_id

  # ----------------------------------------------------------------------------
  # 2. Bucket Profil Utilisateur Connecté (Self Profile)
  #    Permet de récupérer instantanément son propre profil même avant affectation.
  # ----------------------------------------------------------------------------
  user_profile:
    parameters: SELECT request.user_id() as user_id
    data:
      - SELECT * FROM public.profiles WHERE id = bucket.user_id

  # ----------------------------------------------------------------------------
  # 3. Bucket Annonces & Alertes Broadcast (Hub ➔ Spoke)
  #    Diffuse les notifications prioritaires émises depuis le Hub.
  # ----------------------------------------------------------------------------
  announcements:
    parameters: >-
      SELECT COALESCE(
        request.jwt() ->> 'tenant_id',
        (SELECT tenant_id::text FROM public.profiles WHERE id = request.user_id())
      ) as tenant_id
    data:
      - SELECT * FROM public.announcements WHERE is_active = true AND (target_tenant_id IS NULL OR target_tenant_id::text = bucket.tenant_id)
