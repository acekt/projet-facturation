<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Facturier — Chargement</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #fafafa;
      color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow background (light) */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(0, 51, 153, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(40px);
      z-index: 0;
      animation: pulse-glow 4s ease-in-out infinite alternate;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px -10px rgba(0, 51, 153, 0.15);
      padding: 12px;
      position: relative;
    }

    /* Inner animated border for the logo */
    .logo-container::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 21px;
      background: linear-gradient(135deg, rgba(0, 51, 153, 0.3), rgba(44, 160, 44, 0.1));
      z-index: -1;
      opacity: 0.5;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #0a0a0a 0%, #52525b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status {
      font-size: 0.85rem;
      color: #71717a;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    /* Subtle loading progress bar */
    .progress-container {
      width: 140px;
      height: 3px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      margin-top: 24px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #003399, #3b82f6);
      border-radius: 4px;
      animation: progress-slide 2s ease-in-out infinite;
    }

    @keyframes fade-in {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-glow {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    @keyframes progress-slide {
      0% { left: -30%; width: 30%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  
  <div class="container">
    <div class="logo-container">
      <img src="icon.png" alt="Logo" class="logo-img" onerror="this.src='logo.png'" />
    </div>
    
    <h1>Facturier</h1>
    
    <div class="status">
      <span>Démarrage du moteur local...</span>
    </div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
