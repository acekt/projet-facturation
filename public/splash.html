<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Facturier — Chargement</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo-container {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      padding: 4px;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .status {
      font-size: 0.8rem;
      color: #71717a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
      animation: pulse-anim 1.5s infinite;
    }
    @keyframes pulse-anim {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Logo Facturier" class="logo-img" />
  </div>
  <h1>Facturier</h1>
  <div class="status">
    <span class="pulse"></span>
    <span>Initialisation du moteur de facturation...</span>
  </div>
</body>
</html>
